name: Continuous Integration & Continuous Delivery DevSecOps

on:
  push:
    branches: 
      - main 
      - develop
  pull_request:
    branches: 
      - main 
      - develop
  
# Remove todas as permissões globais por padrão (Princípio do Menor Privilégio)
permissions: {}

jobs:
  # =========================================================================
  # ESTÁGIO DE CONTINUOUS INTEGRATION (CI) - Execuções em Paralelo
  # =========================================================================
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    name: Code Quality (Lint & Typecheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute linter
        run: npm run lint

      - name: Verify TypeScript types
        run: npm run typecheck

  unit-tests:
    name: Automated Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  static-security-sast:
    name: Security (SAST - CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Necessário para publicar os alertas no painel de segurança do GitHub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  dependency-audit-sca:
    name: Security (SCA - NPM Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high

  dynamic-security-dast:
    name: Security (DAST - OWASP ZAP API)
    needs: [code-quality, unit-tests] 
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start API in Background
        run: npm run start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for API to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://localhost:3000'
          format: openapi
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'

      - name: Upload ZAP Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-dast-report
          path: zap_out.html
          retention-days: 7
  
  infrastructure-audit-iac:
    name: Security (IaC - Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: ./terraform
          soft_fail: false # Faz a pipeline falhar se encontrar falhas de segurança
          output_format: cli
          # Pula checagens de monitoramento/auditoria rígidas que não se aplicam ao LocalStack
          skip_check: |
            CKV_AWS_8,
            CKV_AWS_21,
            CKV_AWS_79,
            CKV_AWS_126,
            CKV_AWS_130,
            CKV_AWS_135,
            CKV_AWS_144,
            CKV_AWS_356,
            CKV2_AWS_11,
            CKV2_AWS_12,
            CKV2_AWS_19,
            CKV2_AWS_41
          # Justificativa técnica dos escopos ignorados:
          # - CKV_AWS_8, 79, 135: Desativados devido a limitações de simulação de hardware do LocalStack
          # - CKV_AWS_130: Subnet pública obrigatória por design para expor a API Node.js
          # - CKV_AWS_21, 144, 356, CKV2_AWS_11, 12, 19: Auditorias corporativas de rede redundantes para fins locais


  # =========================================================================
  # ESTÁGIO DE CONTINUOUS DELIVERY (CD) - Build, Scan de Imagem e Publicação
  # =========================================================================

  deploy-ghcr:
    name: Continuous Delivery (GHCR)
    # Exige aprovação de TODOS os jobs de CI e Segurança antes de prosseguir
    needs: [code-quality, unit-tests, static-security-sast, dependency-audit-sca, dynamic-security-dast]
    # Executa apenas em pushes diretos ou merges nas branches principais de produção
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Retém o push para aguardar a validação do Trivy
          tags: ghcr.io/${{ github.repository }}:latest
          load: true # Disponibiliza a imagem compilada no daemon local do Docker do Runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:latest'
          format: 'table'
          exit-code: '1' # Falha a pipeline se encontrar falhas impeditivas
          ignore-unfixed: true # Ignora vulnerabilidades sem correção upstream oficial
          severity: 'CRITICAL,HIGH' # Bloqueia apenas riscos Altos e Críticos

      - name: Push Docker Image to GHCR
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
